name: Deploy to MaviHost

on:
  push:
    branches: [ main ]

jobs:
  webhook-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paketle
        run: |
          zip -r ../payload.zip . \
            -x '.git/*' '.github/*' '.cpanel.yml' 'webhook-deploy.php'

      - name: Webhook'a gönder
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -F "payload=@../payload.zip" \
            "https://uzaykaya.com.tr/webhook-deploy.php"
