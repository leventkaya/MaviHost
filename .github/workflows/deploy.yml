name: Deploy to MaviHost

on:
  push:
    branches: [ main ]

jobs:
  cpanel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git pull tetikle (cPanel)
        run: |
          echo "--- PULL ---"
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            --data-urlencode "repository_root=/home/uzayka/repositories/MaviHost_ses"

      - name: Dağıtımı tetikle (.cpanel.yml)
        run: |
          echo "--- DEPLOY ---"
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            --data-urlencode "repository_root=/home/uzayka/repositories/MaviHost_ses"
